name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"
  NODE_VERSION: "22"
  PNPM_VERSION: "11.20.0"

jobs:
  app:
    name: App · analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Web 是唯一能在 CI 上不带签名、不带 Android SDK 就构建完的目标，
      # 用它兜住「代码能编译成产物」这一层。APK 出包在本机走
      # scripts/release.sh —— 那里还会核对启动 Activity 有没有被 R8 删掉。
      #
      # ★ 绝不要在这里传 --dart-define=ZHIPU_API_KEY：Web 产物是公开 JS。
      - name: Build web
        run: flutter build web --release

  web:
    name: Website · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck scripts
        run: pnpm lint

      - name: Typecheck website
        run: pnpm --filter website check

  data:
    name: Data · 词表格式与 library.json 一致
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # 词表格式：`word | pos | meaning`，1 或 3 列（全角 ｜ 也认），只有 word 必填。
      - name: Validate data files
        run: pnpm data:check

      # 改了 data/ 却忘了重新生成 assets/data/library.json，应用里就是旧词表。
      # 这种漏更新在 Expo 时代真的发生过（4 个词表的词性标注错了一个版本）。
      - name: Regenerate and diff
        run: |
          set -euo pipefail
          pnpm data:gen
          if ! git diff --quiet -- assets/data/library.json; then
            echo "::error::assets/data/library.json 与 data/ 不一致，请运行 pnpm data:gen 并提交"
            git --no-pager diff --stat -- assets/data/library.json
            exit 1
          fi
