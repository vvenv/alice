# alice-website-managed
# 与线上 /etc/nginx/sites-available/alice.edao.plus 对齐。改完后：
#   scp scripts/nginx-alice.edao.plus.conf "$DEPLOY_SERVER:/etc/nginx/sites-available/alice.edao.plus"
#   ssh "$DEPLOY_SERVER" 'nginx -t && systemctl reload nginx'
server {
    listen 443 ssl;
    server_name alice.edao.plus;

    root /var/www/alice;
    index index.html;

    # SSL
    ssl_certificate /etc/letsencrypt/live/alice.edao.plus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alice.edao.plus/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Ubuntu nginx 1.24 的 mime.types 只有 js，没有 mjs。
    # Flutter --wasm 的入口是 main.dart.mjs；落到 application/octet-stream
    # 再叠加 X-Content-Type-Options: nosniff，浏览器会拒掉模块脚本，
    # /app/ 卡在「正在加载」。同级再写一个 types 是往这份表上追加，不是覆盖。
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/wasm;

    # 静态资源缓存（mjs / wasm 是 Flutter wasm 产物，体积大，值得长缓存）
    location ~* \.(mjs|js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # SPA 路由回退
    # COOP / COEP 加在文档响应上：Flutter Skwasm 多线程需要跨源隔离。
    # credentialless 比 require-corp 宽松，跨源 fetch（OCR / 发音）不必带 CORP。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name alice.edao.plus;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
