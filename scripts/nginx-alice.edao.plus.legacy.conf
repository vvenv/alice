# 可选：旧域名兼容。等 alice.edao.plus 的 DNS 指到本机、并用 certbot 签出旧域名证书后再装：
#   scp scripts/nginx-alice.edao.plus.legacy.conf "$DEPLOY_SERVER:/etc/nginx/sites-available/alice.edao.plus"
#   ssh "$DEPLOY_SERVER" 'ln -sf /etc/nginx/sites-available/alice.edao.plus /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx'
#
# 旧域名 alice.edao.plus：整站 301 到新域名。
# 已经印出去的下载二维码编码的是 https://alice.edao.plus/#download，
# 所以这一段和旧证书都得留着；#download 由浏览器在跳转后带上。
server {
    listen 443 ssl;
    server_name alice.edao.plus;

    ssl_certificate /etc/letsencrypt/live/alice.edao.plus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alice.edao.plus/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://alice.wenfu.dev$request_uri;
    }
}

server {
    listen 80;
    server_name alice.edao.plus;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://alice.wenfu.dev$request_uri;
    }
}
