org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 这台机器上到 dl.google.com / Maven 的连接会「建立成功但零字节」地挂死，
# Gradle 默认的超时是 30 秒连接 / 30 秒读取但对已建立的空闲连接不生效，
# 这里显式收紧，让挂死的连接快速失败并重试，而不是无限等待。
org.gradle.internal.http.connectionTimeout=30000
org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
